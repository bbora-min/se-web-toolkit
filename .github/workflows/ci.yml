name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: write }   # tag job
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }          # check:release 가 main 과 비교한다
      - uses: pnpm/action-setup@v4   # 버전은 package.json 의 packageManager
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm lint
      - run: pnpm -r test
      - run: pnpm check-identity
      - run: pnpm check:skill-docs        # 스킬 문서가 코드와 어긋나면 실패
      - run: pnpm check:release           # 버전 한 값 · 코드 변경 시 버전·CHANGELOG 필수
      - run: pnpm -r --filter './examples/*' --filter './templates/*' --filter se-site build
      - run: pnpm build:storybook          # 스토리가 컴파일되는지

  visual:
    # 레퍼런스 앱 3개의 화면을 기준 스크린샷과 비교 — "화면이 바뀌었는데 patch" 를 기계로 잡는다.
    # 의도한 변화면 Actions › visual-baseline 워크플로로 기준을 다시 찍는다(같은 러너 이미지라 로컬 차이가 없다)
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm visual
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diff
          retention-days: 7
          path: |
            examples/*/test-results
            apps/site/test-results

  react18:
    # peer "^18.2 || ^19" 를 실제로 검증 — 18 로 강제 설치해 @se/ui·charts typecheck, 템플릿 앱 typecheck·build·e2e
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: ./scripts/react18-lane.sh

  tag:
    # main 에 merge 되면 루트 package.json 의 버전으로 태그 — 앱은 이 태그(github:…#v0.5.0&path:…)를 가리킨다
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: |
          tag="v$(node -p "require('./package.json').version")"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            if git diff --quiet "$tag" HEAD -- packages templates plugin; then echo "$tag 이미 있음 (출하물 동일)"; exit 0; fi
            echo "✗ $tag 이 이미 있는데 packages/templates/plugin 이 다릅니다 — 버전을 올리는 PR 이 필요합니다"; exit 1
          fi
          git config user.name github-actions && git config user.email github-actions@github.com
          git tag -a "$tag" -m "SE Web Toolkit $tag" && git push origin "$tag" && echo "✓ $tag"
