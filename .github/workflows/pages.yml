name: pages
# main 을 GitHub Pages 한 사이트로: / 사이트 · /storybook/ · /apps/<id>/ 예제 앱(브라우저 목) — scripts/build-pages.mjs
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    # 저장소 Variables 에 DEPLOY_PAGES=true(예전 DEPLOY_STORYBOOK=true 도 인정)를 넣고 Settings › Pages › Source = GitHub Actions 를 켜면 배포된다. 그 전엔 조용히 건너뛴다
    if: vars.DEPLOY_PAGES == 'true' || vars.DEPLOY_STORYBOOK == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: PAGES_BASE=/${{ github.event.repository.name }}/ node scripts/build-pages.mjs
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
