name: publish
# 태그가 찍히면 @se/* 를 npm(또는 사내 레지스트리)에 올린다.
# 켜는 법: 저장소 Variables NPM_PUBLISH=true (선택: NPM_REGISTRY=https://npm.example.com/), Secrets NPM_TOKEN.
# 그 전까지 앱은 git 태그 참조(github:…#v0.9.0&path:…)를 쓴다 — 둘 다 같은 버전이다.
on:
  push: { tags: ['v*'] }
permissions: { contents: read, id-token: write }
jobs:
  publish:
    if: vars.NPM_PUBLISH == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: ${{ vars.NPM_REGISTRY || 'https://registry.npmjs.org' }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --filter './packages/*' publish --access public --no-git-checks
        env: { NODE_AUTH_TOKEN: '${{ secrets.NPM_TOKEN }}' }
